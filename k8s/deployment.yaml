
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-nginx
  template:
    metadata:
      labels:
        app: secure-nginx
    spec:
      containers:
        - name: app
          image: devsecops-demo:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
