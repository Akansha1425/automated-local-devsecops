
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: trusted-registry-only
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        (object.spec.containers
        + object.spec.?initContainers.orValue([]))
        .all(c, c.image.startsWith('docker.io/'))
      message: "Container images must come from the trusted docker.io registry."
