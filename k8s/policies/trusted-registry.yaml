
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: trusted-registry-only
spec:
  validationActions:
    - Deny
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        (object.spec.containers
        + object.spec.?initContainers.orValue([]))
        .all(c, c.image == 'devsecops-demo:local'
        || (c.image.matches('^docker[.]io/library/nginx:[0-9][A-Za-z0-9_.-]{0,127}$')
        && !c.image.endsWith(':latest')))
      message: "Container images must be devsecops-demo:local or a version-tagged image from the approved docker.io/library/nginx repository."
