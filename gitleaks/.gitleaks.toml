# ============================================================
# .gitleaks.toml — Gitleaks Configuration for DevSecOps Demo
# Member 1: Secret Detection Gate
# ============================================================
#
# This file controls how Gitleaks scans the repository.
# Gitleaks has a large built-in ruleset that covers most common
# secret types (AWS keys, GitHub tokens, JWT, etc.).
# We extend it here with a few custom rules for the demo.
#
# IMPORTANT: This config does NOT disable any default detection
# rules — it only adds extra custom rules on top.
# ============================================================

# ------------------------------------------------------------------
# [extend] — Inherit all upstream built-in rules from Gitleaks.
# This is the recommended approach: keep all default detections
# and simply add your own custom rules on top.
# ------------------------------------------------------------------
[extend]
useDefault = true   # Load Gitleaks built-in ruleset (recommended)

# ------------------------------------------------------------------
# [allowlist] — Global exceptions applied to EVERY rule.
# Use this sparingly; over-listing here weakens security.
#
# We allow the test-secrets/bad.env ONLY for the intentional demo.
# In a real production repo you would NOT add this allowlist entry;
# instead you would fix the leak or rotate the credential.
# ------------------------------------------------------------------
# (No global allowlists — we WANT bad.env to be detected as a demo)

# ------------------------------------------------------------------
# Custom rule: catch generic high-entropy "password" assignments.
# Pattern explanation:
#   (?i)          — case-insensitive
#   (password|passwd|pwd)  — common password variable names
#   \s*=\s*"      — equals sign with optional spaces, opening quote
#   ([^"]{8,})    — at least 8 non-quote chars (the secret value)
#   "             — closing quote
# ------------------------------------------------------------------
[[rules]]
id          = "generic-password-assignment"
description = "Detects generic password assignments in config or env files"
regex       = '''(?i)(password|passwd|pwd)\s*=\s*"([^"]{8,})"'''
secretGroup = 2   # Capture group 2 is the actual secret value

  # Rule-level allowlist: skip lines that are obviously placeholders
  [rules.allowlist]
  regexes = [
    '''(?i)(your[_-]?password|<password>|changeme|placeholder)'''
  ]

# ------------------------------------------------------------------
# Custom rule: catch generic API key assignments.
# Matches patterns like:  API_KEY="abc123..."
# ------------------------------------------------------------------
[[rules]]
id          = "generic-api-key-assignment"
description = "Detects generic API key / token assignments"
regex       = '''(?i)(api[_-]?key|api[_-]?token|access[_-]?token)\s*=\s*"([A-Za-z0-9_\-]{10,})"'''
secretGroup = 2

  [rules.allowlist]
  regexes = [
    '''(?i)(your[_-]?api[_-]?key|<api_key>|placeholder|example)'''
  ]

# ------------------------------------------------------------------
# Custom rule: AWS-style secret access key pattern.
# Real AWS secret keys are 40-char base64 strings.
# We match a slightly broader pattern to catch test values too.
# ------------------------------------------------------------------
[[rules]]
id          = "aws-secret-key-assignment"
description = "Detects AWS_SECRET_ACCESS_KEY variable assignments"
regex       = '''(?i)aws[_-]?secret[_-]?access[_-]?key\s*=\s*"([A-Za-z0-9/+=]{10,})"'''
secretGroup = 1

  [rules.allowlist]
  regexes = [
    '''(?i)(your[_-]?secret|placeholder|<secret>)'''
  ]
