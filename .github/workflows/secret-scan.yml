# ==============================================================================
# Caller Workflow: Secret Scan Gate
# Project: Automated Local DevSecOps — Secret Scanner & Image Guard
# Module: Member 1 — Secret Security Gate
# Repository: Akansha1425/automated-local-devsecops
# ==============================================================================
# This workflow invokes the reusable Gitleaks workflow whenever commits are
# pushed to 'main', pull requests target 'main', or via manual dispatch.
# ==============================================================================

name: "Secret Scan Gate"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: "Run Reusable Gitleaks Security Gate"
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read
    with:
      config-path: "gitleaks/.gitleaks.toml"
      fetch-depth: 0
      gitleaks-version: "8.21.2"
      fail-on-leak: true
    secrets: inherit
